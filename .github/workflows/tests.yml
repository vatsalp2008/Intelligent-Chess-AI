name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # The engines and their tests only need python-chess; the pinned
        # requirements file also drags in Flask, matplotlib and PyInstaller.
        run: python -m pip install --upgrade pip chess

      - name: Run classic agent tests
        working-directory: classic_agent
        run: python -m unittest discover -p "test_evaluation.py" -v

      - name: Run search safety tests
        working-directory: classic_agent
        run: python -m unittest discover -p "test_search_safety.py" -v

      - name: Run engine loader tests
        working-directory: classic_agent
        run: python -m unittest discover -p "test_bot_loader.py" -v

      - name: Run tournament runner tests
        working-directory: classic_agent
        run: python -m unittest discover -p "test_tournament.py" -v

      - name: Run tactical regression suite
        # Exits non-zero if the engine stops solving a position it used to
        working-directory: classic_agent
        run: python tactics.py

      - name: Run LLM agent search tests
        working-directory: llm_agent
        run: python -m unittest discover -p "test_knightmare.py" -v

      - name: Run LLM prompt parsing tests
        # These import the bots without Ollama installed, which is what the
        # optional import in those modules exists to allow.
        working-directory: llm_agent
        run: python -m unittest discover -p "test_llm_parsing.py" -v

      - name: Check every tracked module compiles
        run: |
          git ls-files '*.py' | xargs python -m py_compile
          echo "all tracked modules compile"
