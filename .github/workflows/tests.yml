name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # The engines and their tests only need python-chess; the pinned
        # requirements file also drags in Flask, matplotlib and PyInstaller.
        run: python -m pip install --upgrade pip chess

      - name: Run classic agent tests
        working-directory: classic_agent
        run: python -m unittest discover -p "test_evaluation.py" -v

      - name: Run LLM agent search tests
        working-directory: llm_agent
        run: python -m unittest discover -p "test_knightmare.py" -v

      - name: Check every tracked module compiles
        run: |
          git ls-files '*.py' | xargs python -m py_compile
          echo "all tracked modules compile"
