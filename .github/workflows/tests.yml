name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # The engines and their tests only need python-chess. Flask is added
        # so the web interface tests run too; the pinned requirements file
        # would also drag in matplotlib and PyInstaller, which nothing here
        # needs. chester and Ollama are deliberately absent: the modules that
        # use them import them optionally so their logic stays testable.
        run: python -m pip install --upgrade pip chess flask

      - name: Run every test suite
        # run_tests.sh is what a developer runs locally, so CI runs the same
        # thing rather than keeping a second list of suites in step with it.
        run: ./run_tests.sh
